services:
  db:
    image: postgres:16
    container_name: ado-postgres
    environment:
      POSTGRES_USER: ado
      POSTGRES_PASSWORD: ado
      POSTGRES_DB: ai_dev_office
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ado"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
