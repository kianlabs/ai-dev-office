[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-tools"
version = "0.1.0"
description = "Tool abstraction layer for AI Dev Office agents"
requires-python = ">=3.11"
dependencies = ["ai-dev-shared"]

[tool.setuptools]
packages = ["ai_dev_tools"]