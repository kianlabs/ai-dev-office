[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-shared"
version = "0.1.0"
description = "Shared domain models and constants for AI Dev Office"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[tool.setuptools]
packages = ["ai_dev_shared"]