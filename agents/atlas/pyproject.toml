[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-agent-atlas"
version = "0.1.0"
description = "ATLAS - Engineering Manager / orchestrator agent"
requires-python = ">=3.11"
dependencies = [
    "ai-dev-agent-core",
    "ai-dev-agent-scout",
    "ai-dev-agent-forge",
    "ai-dev-agent-qa",
    "ai-dev-agent-pulse",
]

[tool.setuptools]
packages = ["ai_dev_agent_atlas"]